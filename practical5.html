<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <head>
        <h1 align="center"><u>Student Registration Form</u></h1>
        <hr>
        <form align="center">
            <label for="Full name:">Full name:</label>
            <input type="text" placeholder="Enter your full name">
            <br><br>

            <label for="Email">Email:</label>
            <input type="email" placeholder="Enter valid email address ">
            <br><br>

            <label for="Password">Password:</label>
            <input type="password" placeholder="Enter password">
            <br><br>

            <label for="Gender">Gender:</label>
            <input type="radio" value="Male" required>Male
            <input type="radio" value="Female" required>Female
            <input type="radio" value="other" required>Other
            <br><br>
            
            <label for="Course">Course:</label>
            <select name="Course" required>
                <option value="">--Select Course--</option>
                <option value="B.Tech">BE/B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
                <option value="BBA">BBA</option>
                <option value="MBA">MBA</option>
            </select>
            <br><br>

            <label for="Contact NO.">Contact Number:</label>
            <input type="tel" placeholder="Enter phone number">
            <br><br>

            <label for="address">Address:</label><br>
            <textarea name="address" rows="4" cols="40" placeholder="Enter your address"></textarea>
            <br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Clear">
            <br><br>
            <hr>

            <p align="center">&copy; 2025 Student Registration Portal</p>
        </form>
    </head>
</html>
